name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate release
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
      release_type: ${{ steps.policy.outputs.release_type }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
      update_channel: ${{ steps.policy.outputs.update_channel }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify updater is a packaged runtime dependency
        run: npm ls electron-updater --omit=dev
      - name: Validate tag and derive release policy
        id: policy
        shell: bash
        run: node build/release-policy.mjs "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Full headless GA gate
        run: xvfb-run -a npm run ga:check
      - name: Require production signing credentials
        if: steps.policy.outputs.publish == 'true'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          ZORNUX_REF: ${{ vars.ZORNUX_REF }}
        run: |
          missing=()
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET TRUSTED_SIGNING_ENDPOINT TRUSTED_SIGNING_ACCOUNT TRUSTED_SIGNING_PROFILE GPG_PRIVATE_KEY GPG_PASSPHRASE ZORNUX_REF; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Refusing to publish unsigned release; missing: ${missing[*]}"
            exit 1
          fi
          if ! [[ "$ZORNUX_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::ZORNUX_REF must be an immutable 40-character commit SHA."
            exit 1
          fi
      - name: Create a draft release for atomic publication
        if: steps.policy.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --draft)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$draft" != true ]; then
              echo "::error::Release $GITHUB_REF_NAME is already published. Refusing a non-atomic overwrite."
              exit 1
            fi
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              [ -z "$asset" ] || gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes --repo "$GITHUB_REPOSITORY"
            done
          else
            gh release create "$GITHUB_REF_NAME" "${args[@]}"
          fi

  windows:
    name: package (windows)
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '8.0.x' }
      - run: dotnet tool install --global sign --version 0.9.1-beta.26371.2
      - run: npm ci
      - name: Stage architecture-matched Zornux runtimes
        shell: bash
        env:
          ZORNUX_REF: ${{ vars.ZORNUX_REF }}
        run: |
          git init ../zornux
          git -C ../zornux remote add origin https://github.com/zornux/zornux.git
          git -C ../zornux fetch --depth 1 origin "${ZORNUX_REF:-main}"
          git -C ../zornux checkout --detach FETCH_HEAD
          ZORNUX_REPO="$(cd ../zornux && pwd)" npm run stage:zornux -- win-x64 win-arm64
      - run: npm run build
      - name: Package and publish
        shell: bash
        run: npx electron-builder --win --publish "${{ needs.validate.outputs.publish == 'true' && 'always' || 'never' }}" --config electron-builder.yml -c.publish.releaseType=${{ needs.validate.outputs.release_type }} -c.publish.channel=${{ needs.validate.outputs.update_channel }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
      - name: Generate checksums
        shell: bash
        run: cd release && sha512sum *.exe > SHA512SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: znxstudio-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/SHA512SUMS.txt
          if-no-files-found: error

  linux:
    name: package (linux)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '8.0.x' }
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - name: Stage architecture-matched Zornux runtimes
        env:
          ZORNUX_REF: ${{ vars.ZORNUX_REF }}
        run: |
          git init ../zornux
          git -C ../zornux remote add origin https://github.com/zornux/zornux.git
          git -C ../zornux fetch --depth 1 origin "${ZORNUX_REF:-main}"
          git -C ../zornux checkout --detach FETCH_HEAD
          ZORNUX_REPO="$(cd ../zornux && pwd)" npm run stage:zornux -- linux-x64 linux-arm64
      - run: npm run build
      - name: Import GPG release key
        if: needs.validate.outputs.publish == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          export GNUPGHOME
          printf 'allow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
      - name: Package and publish
        run: npx electron-builder --linux --publish "${{ needs.validate.outputs.publish == 'true' && 'always' || 'never' }}" --config electron-builder.yml -c.publish.releaseType=${{ needs.validate.outputs.release_type }} -c.publish.channel=${{ needs.validate.outputs.update_channel }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Checksums and signature
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          cd release
          sha256sum *.AppImage *.deb *.rpm > SHA256SUMS.txt
          if [ "${{ needs.validate.outputs.publish }}" = true ]; then
            KEY="${GPG_KEY_ID:-release@znxstudio.dev}"
            printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --local-user "$KEY" --armor --detach-sign --output SHA256SUMS.txt.asc SHA256SUMS.txt
            gpg --armor --export "$KEY" > znxstudio-signing-public.asc
            gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: znxstudio-linux
          path: |
            release/*.AppImage
            release/*.AppImage.blockmap
            release/*.deb
            release/*.rpm
            release/*.yml
            release/SHA256SUMS.txt*
            release/znxstudio-signing-public.asc
          if-no-files-found: error

  finalize:
    name: finalize release
    if: needs.validate.outputs.publish == 'true'
    needs: [validate, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with: { path: artifacts }
      - name: Attach signed manifests to the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find artifacts -type f \( -name 'SHA*SUMS.txt*' -o -name 'znxstudio-signing-public.asc' \) -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=${{ needs.validate.outputs.prerelease }}

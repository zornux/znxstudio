# Release packaging — builds the signed Windows + Linux artifacts from a version
# tag and publishes them as a GitHub Release. (macOS is deferred: it needs an
# Apple Developer ID cert + notarization on a macOS runner.)
#
# Windows: Azure Trusted Signing via Microsoft's `sign` .NET tool (build/win-sign.js).
# Linux: no purchased cert is required — a free GPG key signs the release. We build
#   AppImage/deb/rpm, then GPG-sign the SHA256SUMS manifest and ship the public key,
#   so every Linux artifact's integrity + authorship is verifiable:
#     gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt  &&  sha256sum -c SHA256SUMS.txt
# Both are CONDITIONAL: absent the signing secrets the build still succeeds but the
# artifacts are UNSIGNED (forks / dry-runs). Linux secrets: GPG_PRIVATE_KEY (base64
# of the armored private key), GPG_PASSPHRASE, and optionally GPG_KEY_ID
# (defaults to release@znxstudio.dev).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # required to create the GitHub Release and upload assets

jobs:
  package:
    name: package (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # .NET + Microsoft's `sign` CLI power the Trusted Signing hook.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Trusted Signing tool
        # `sign` (github.com/dotnet/sign) publishes as prerelease on NuGet.
        # Pinned to the version verified to sign successfully (2026-08-07) so the
        # release toolchain is reproducible and immune to a future build removing
        # the (now-obsolete) `trusted-signing` command. Bump deliberately.
        run: dotnet tool install --global sign --version 0.9.1-beta.26371.2

      - run: npm ci
      - run: npm run build
      # electron-updater is loaded at runtime (optional require) but not bundled;
      # install it so packaging metadata + auto-update wiring resolve.
      - run: npm i -D electron-updater@^6

      # On a tag build, electron-builder publishes to the GitHub Release for the
      # tag (installers + blockmaps + latest.yml, the electron-updater feed).
      # On a workflow_dispatch (no tag) it stays a dry-run: build + sign, publish
      # nothing. latest.yml is only generated when publishing.
      - name: Package (+ Trusted Signing, publish on tag)
        run: npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }} --config electron-builder.yml
        env:
          # GitHub Releases publisher (electron-builder reads GH_TOKEN).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Azure service principal — consumed by DefaultAzureCredential in `sign`.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Trusted Signing account/profile/endpoint.
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          find . -maxdepth 1 -type f -name '*.exe' -print0 \
            | xargs -0 -I{} sh -c 'sha512sum "{}" >> SHA512SUMS.txt' || true
          cat SHA512SUMS.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: znxstudio-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/SHA512SUMS.txt
            release/latest*.yml
          if-no-files-found: warn

      # electron-builder attaches the installers/blockmaps/latest.yml itself;
      # add the SHA512SUMS.txt manifest to the same Release (tag builds only).
      - name: Attach checksums to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" release/SHA512SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-linux:
    name: package (linux)
    runs-on: ubuntu-latest
    # The Windows job creates the GitHub Release for the tag; we add the Linux
    # assets to that same release afterwards.
    needs: package
    env:
      # Evaluated at job setup so we can gate signing steps without putting a
      # secret in an `if:` (which is not reliably supported).
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # electron-builder's rpm target needs system rpm tooling on Ubuntu.
      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci
      - run: npm run build
      - run: npm i -D electron-updater@^6

      - name: Import GPG signing key
        if: env.HAS_GPG == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # Use an isolated, throwaway keyring so nothing leaks into the runner's
          # default GNUPGHOME; the path is exported so the signing step reuses it.
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          export GNUPGHOME
          # A CI runner has no TTY, so the passphrase must arrive over the loopback
          # pinentry. The agent refuses that unless allow-loopback-pinentry is set —
          # without it, `gpg --detach-sign` dies with "Too much data for IPC layer".
          printf 'allow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"
          printf 'pinentry-mode loopback\n' > "$GNUPGHOME/gpg.conf"
          gpgconf --kill gpg-agent || true
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          gpg --list-secret-keys --keyid-format long

      # On a tag, electron-builder uploads AppImage/deb/rpm + latest-linux.yml
      # (the electron-updater feed) to the release; the signing step below then
      # adds a GPG-signed manifest over those exact bytes. workflow_dispatch stays
      # a dry-run (build only).
      - name: Package Linux artifacts (publish on tag)
        run: npx electron-builder --linux --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }} --config electron-builder.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checksums + GPG signature
        shell: bash
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          cd release
          # One manifest over every distributable artifact.
          sha256sum *.AppImage *.deb *.rpm > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt || true
          if [ "$HAS_GPG" = "true" ]; then
            KEY="${GPG_KEY_ID:-release@znxstudio.dev}"
            # Feed the passphrase on fd 0 (not a --passphrase arg) so it never lands
            # in the process table; loopback pinentry was enabled at import time.
            printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --local-user "$KEY" --armor --detach-sign \
              --output SHA256SUMS.txt.asc SHA256SUMS.txt
            gpg --armor --export "$KEY" > znxstudio-signing-public.asc
            gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt
            echo "Signed the release manifest with $KEY."
          else
            echo "::warning::GPG_PRIVATE_KEY not set — Linux artifacts are UNSIGNED."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: znxstudio-linux
          path: |
            release/*.AppImage
            release/*.AppImage.blockmap
            release/*.deb
            release/*.rpm
            release/latest-linux*.yml
            release/SHA256SUMS.txt*
            release/znxstudio-signing-public.asc
          if-no-files-found: warn

      # electron-builder already uploaded the artifacts + latest-linux.yml; add the
      # signed manifest + public key to the same release.
      - name: Attach signed manifest + public key to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" \
            SHA256SUMS.txt SHA256SUMS.txt.asc znxstudio-signing-public.asc \
            --clobber --repo "$GITHUB_REPOSITORY"

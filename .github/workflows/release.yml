# Release packaging — builds the signed Windows installers from a version tag
# and publishes them as a GitHub Release.
#
# Windows-only for now (Linux/macOS targets exist in electron-builder.yml and
# can be added back as matrix entries later). Signing uses Azure Trusted Signing
# via Microsoft's `sign` .NET tool, driven by the build/win-sign.js hook — it is
# CONDITIONAL: without the TRUSTED_SIGNING_* / AZURE_* secrets the build still
# succeeds but produces UNSIGNED artifacts (e.g. on forks / dry-runs).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # required to create the GitHub Release and upload assets

jobs:
  package:
    name: package (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # .NET + Microsoft's `sign` CLI power the Trusted Signing hook.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Trusted Signing tool
        # `sign` (github.com/dotnet/sign) publishes as prerelease on NuGet.
        # Pinned to the version verified to sign successfully (2026-08-07) so the
        # release toolchain is reproducible and immune to a future build removing
        # the (now-obsolete) `trusted-signing` command. Bump deliberately.
        run: dotnet tool install --global sign --version 0.9.1-beta.26371.2

      - run: npm ci
      - run: npm run build
      # electron-updater is loaded at runtime (optional require) but not bundled;
      # install it so packaging metadata + auto-update wiring resolve.
      - run: npm i -D electron-updater@^6

      # On a tag build, electron-builder publishes to the GitHub Release for the
      # tag (installers + blockmaps + latest.yml, the electron-updater feed).
      # On a workflow_dispatch (no tag) it stays a dry-run: build + sign, publish
      # nothing. latest.yml is only generated when publishing.
      - name: Package (+ Trusted Signing, publish on tag)
        run: npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }} --config electron-builder.yml
        env:
          # GitHub Releases publisher (electron-builder reads GH_TOKEN).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Azure service principal — consumed by DefaultAzureCredential in `sign`.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Trusted Signing account/profile/endpoint.
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}

      - name: Generate checksums
        shell: bash
        run: |
          cd release
          find . -maxdepth 1 -type f -name '*.exe' -print0 \
            | xargs -0 -I{} sh -c 'sha512sum "{}" >> SHA512SUMS.txt' || true
          cat SHA512SUMS.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: znxstudio-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/SHA512SUMS.txt
            release/latest*.yml
          if-no-files-found: warn

      # electron-builder attaches the installers/blockmaps/latest.yml itself;
      # add the SHA512SUMS.txt manifest to the same Release (tag builds only).
      - name: Attach checksums to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" release/SHA512SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
